<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CT Attendance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">

    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo-mark">CT</div>
        <div>
          <div class="app-title">Attendance</div>
          <div class="app-sub">IIITB · CodeTantra</div>
        </div>
      </div>
      <div class="header-right">
        <button class="icon-btn" id="notifToggle" title="Toggle notifications">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </button>
        <button class="icon-btn" id="settingsToggle" title="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Settings panel (hidden by default) -->
    <div class="settings-panel hidden" id="settingsPanel">
      <div class="settings-row">
        <label class="settings-label">Target User ID <span class="hint">(leave blank for yourself)</span></label>
        <input type="text" id="targetUserId" class="settings-input" placeholder="6879089afb8e5a06b3b69841">
      </div>
      <div class="settings-row">
        <label class="settings-label">Safe attendance threshold</label>
        <div class="threshold-row">
          <input type="range" id="thresholdSlider" min="50" max="90" value="75" step="5">
          <span id="thresholdVal" class="mono">75%</span>
        </div>
      </div>
      <div class="settings-row">
        <label class="settings-label">Group subjects by prefix</label>
        <label class="toggle-wrap">
          <input type="checkbox" id="prefixGrouping" checked>
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
        </label>
      </div>
    </div>

    <!-- Date range -->
    <div class="date-section">
      <div class="date-presets">
        <button class="preset active" data-preset="month">This month</button>
        <button class="preset" data-preset="semester">Semester</button>
        <button class="preset" data-preset="custom">Custom</button>
      </div>
      <div class="date-inputs hidden" id="customDates">
        <div class="date-pair">
          <div class="date-field">
            <label>From</label>
            <input type="date" id="startDate">
          </div>
          <div class="date-field">
            <label>To</label>
            <input type="date" id="endDate">
          </div>
        </div>
      </div>
    </div>

    <!-- Calculate button -->
    <button class="calc-btn" id="calcBtn">
      <span id="btnText">Calculate</span>
      <span id="btnLoader" class="hidden">
        <span class="dot-loader"><span></span><span></span><span></span></span>
      </span>
    </button>

    <!-- Progress bar -->
    <div class="fetch-progress hidden" id="fetchProgress">
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <div class="fetch-status" id="fetchStatus">Fetching classes...</div>
    </div>

    <!-- Summary bar -->
    <div class="summary-bar hidden" id="summaryBar">
      <div class="summary-item">
        <span class="summary-num" id="sumTotal">—</span>
        <span class="summary-label">classes</span>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-item">
        <span class="summary-num" id="sumAttended">—</span>
        <span class="summary-label">attended</span>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-item">
        <span class="summary-num" id="sumPct">—</span>
        <span class="summary-label">overall</span>
      </div>
    </div>

    <!-- Results -->
    <div id="results" class="results"></div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
